[project]
name = "prarup"
version = "0.1.0"
description = "Pre-flight compliance checker for research paper submissions"
authors = [
    { name = "Prateek Kalal" },
    { name = "Om Patel" },
    { name = "Krushna Parmar" },
]
readme = "README.md"
# PySide6 has no wheels for 3.14 yet, so the ceiling is real
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymupdf (>=1.28)",
    "pyyaml (>=6.0)",
    "jinja2 (>=3.1)",
    "pyside6 (>=6.7)",
    "pillow (>=13.0.0,<14.0.0)",
    "c2pa-python (>=0.39.0,<0.40.0)",
]

[project.scripts]
prarup = "prarup.main:main"
prarup-gui = "prarup.gui:main"

[tool.poetry]
package-mode = true

# The AI-image classifier (layer 3). Optional: about 1-2 GB with PyTorch.
#   poetry install --with ai
[tool.poetry.group.ai]
optional = true

[tool.poetry.group.ai.dependencies]
torch = ">=2.2"
transformers = ">=4.44"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
matplotlib = ">=3.8"          # only used by tools/make_fixtures.py
pytest-qt = ">=4.4"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
